<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabiq Simple Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="card__content">
        <p class="eyebrow">Sabiq</p>
        <h1>Welcome to Sabiq</h1>
        <p class="subtitle">A simple project starter.</p>

        <div class="todo-box">
          <div class="todo-box__top">
            <span class="todo-label">Today’s Tasks</span>
            <button class="add-btn" id="addTaskBtn">+</button>
          </div>

          <ul class="todo-list" id="todoList">
            <li class="todo-item">
              <input type="checkbox" class="todo-check" />
              <span class="todo-text">Create a plan</span>
            </li>
            <li class="todo-item">
              <input type="checkbox" class="todo-check" />
              <span class="todo-text">Build the project</span>
            </li>
          </ul>

          <form class="task-form" id="taskForm">
            <input type="text" id="taskInput" placeholder="Add a new task" autocomplete="off" />
            <button type="submit">Add</button>
          </form>
        </div>

        <div class="info-row">
          <span class="status-dot"></span>
          <span id="statusText">Project is ready</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
